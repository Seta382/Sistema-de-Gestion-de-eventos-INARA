<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B1818"/>
      <stop offset="50%" stop-color="#4A2828"/>
      <stop offset="100%" stop-color="#1F1212"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#E7D5B3" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#C6A15B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E7D5B3"/>
      <stop offset="50%" stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#9E7832"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="200" r="260" fill="url(#glow)"/>

  <!-- Decorative Border -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.5" rx="16"/>
  <rect x="35" y="35" width="730" height="430" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="6,4" stroke-opacity="0.3" rx="12"/>

  <!-- Floral Arch Silhouettes -->
  <g opacity="0.25" fill="#E7D5B3">
    <path d="M 200,450 C 200,200 300,100 400,100 C 500,100 600,200 600,450" stroke="#C6A15B" stroke-width="3" fill="none"/>
    <circle cx="400" cy="100" r="8"/>
    <circle cx="340" cy="120" r="6"/>
    <circle cx="460" cy="120" r="6"/>
    <circle cx="280" cy="160" r="7"/>
    <circle cx="520" cy="160" r="7"/>
    <circle cx="230" cy="220" r="6"/>
    <circle cx="570" cy="220" r="6"/>
  </g>

  <!-- Wedding Rings Icon Center -->
  <g transform="translate(400, 190)" filter="url(#shadow)">
    <!-- Ring 1 -->
    <ellipse cx="-22" cy="0" rx="42" ry="42" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <ellipse cx="-22" cy="-42" rx="7" ry="5" fill="#FFFFFF"/>
    <polygon points="-22,-52 -18,-42 -22,-38 -26,-42" fill="#E7D5B3"/>
    <!-- Ring 2 -->
    <ellipse cx="22" cy="10" rx="38" ry="38" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.9"/>
    <!-- Stars -->
    <path d="M 0,-70 Q 0,-50 15,-50 Q 0,-50 0,-30 Q 0,-50 -15,-50 Q 0,-50 0,-70 Z" fill="url(#gold)"/>
    <circle cx="-90" cy="-20" r="2.5" fill="#E7D5B3" opacity="0.7"/>
    <circle cx="95" cy="-10" r="2.5" fill="#E7D5B3" opacity="0.7"/>
    <circle cx="-70" cy="50" r="2" fill="#E7D5B3" opacity="0.5"/>
    <circle cx="80" cy="60" r="2" fill="#E7D5B3" opacity="0.5"/>
  </g>

  <!-- Text & Typography -->
  <text x="400" y="320" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="2">
    BODAS DE ENSUEÑO
  </text>
  <text x="400" y="355" font-family="'Montserrat', sans-serif" font-size="14" font-weight="500" fill="#E7D5B3" text-anchor="middle" letter-spacing="4" opacity="0.85">
    PRODUCCIÓN &amp; DISEÑO NUPCIAL EXCLUSIVO
  </text>
  <line x1="300" y1="380" x2="500" y2="380" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="400" y="415" font-family="'Montserrat', sans-serif" font-size="12.5" fill="#D8A7A7" text-anchor="middle" letter-spacing="1.5">
    INARA LUXURY EVENTS • MOMENTOS INOLVIDABLES
  </text>
</svg>