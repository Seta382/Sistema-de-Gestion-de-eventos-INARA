<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B221B"/>
      <stop offset="50%" stop-color="#2D382B"/>
      <stop offset="100%" stop-color="#111611"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF2D6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#C6A15B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1B221B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF0CC"/>
      <stop offset="50%" stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#9E7832"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="200" r="260" fill="url(#glow)"/>

  <!-- Decorative Border -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.5" rx="16"/>
  <rect x="35" y="35" width="730" height="430" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="6,4" stroke-opacity="0.3" rx="12"/>

  <!-- Catering Cloche & Champagne Flutes Center -->
  <g transform="translate(400, 195)" filter="url(#shadow)">
    <!-- Cloche Platter -->
    <ellipse cx="0" cy="30" rx="70" ry="8" fill="url(#gold)"/>
    <!-- Dome Cover -->
    <path d="M -55,26 C -55,-15 55,-15 55,26 Z" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <!-- Handle -->
    <circle cx="0" cy="-22" r="7" fill="url(#gold)"/>

    <!-- Left Champagne Glass -->
    <g transform="translate(-85, 10)">
      <path d="M -8,-35 L 8,-35 L 5,-10 L -5,-10 Z" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
      <line x1="0" y1="-10" x2="0" y2="15" stroke="url(#gold)" stroke-width="2.5"/>
      <ellipse cx="0" cy="15" rx="10" ry="3" fill="url(#gold)"/>
      <circle cx="-1" cy="-22" r="1.5" fill="#FFF"/>
      <circle cx="2" cy="-15" r="1.5" fill="#FFF"/>
    </g>

    <!-- Right Champagne Glass -->
    <g transform="translate(85, 10)">
      <path d="M -8,-35 L 8,-35 L 5,-10 L -5,-10 Z" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
      <line x1="0" y1="-10" x2="0" y2="15" stroke="url(#gold)" stroke-width="2.5"/>
      <ellipse cx="0" cy="15" rx="10" ry="3" fill="url(#gold)"/>
      <circle cx="1" cy="-20" r="1.5" fill="#FFF"/>
      <circle cx="-2" cy="-14" r="1.5" fill="#FFF"/>
    </g>

    <!-- Sparkles -->
    <path d="M 0,-45 Q 0,-35 10,-35 Q 0,-35 0,-25 Q 0,-35 -10,-35 Q 0,-35 0,-45 Z" fill="#FFF0CC"/>
    <circle cx="-45" cy="-20" r="2.5" fill="#FFF0CC" opacity="0.8"/>
    <circle cx="45" cy="-20" r="2.5" fill="#FFF0CC" opacity="0.8"/>
  </g>

  <!-- Text & Typography -->
  <text x="400" y="320" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="2">
    CATERING DE AUTOR
  </text>
  <text x="400" y="355" font-family="'Montserrat', sans-serif" font-size="14" font-weight="500" fill="#FFF0CC" text-anchor="middle" letter-spacing="4" opacity="0.85">
    GASTRONOMÍA DE GALA &amp; COCTELERÍA
  </text>
  <line x1="300" y1="380" x2="500" y2="380" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="400" y="415" font-family="'Montserrat', sans-serif" font-size="12.5" fill="#B2CDB2" text-anchor="middle" letter-spacing="1.5">
    INARA GOURMET • MENÚS DE 4 TIEMPOS &amp; MARIDAJE
  </text>
</svg>