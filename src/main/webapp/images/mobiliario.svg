<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261E1A"/>
      <stop offset="50%" stop-color="#42342B"/>
      <stop offset="100%" stop-color="#1A1411"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF5E5" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#C6A15B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#261E1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE8B5"/>
      <stop offset="50%" stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#9E7832"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="200" r="260" fill="url(#glow)"/>

  <!-- Decorative Border -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.5" rx="16"/>
  <rect x="35" y="35" width="730" height="430" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="6,4" stroke-opacity="0.3" rx="12"/>

  <!-- Chandelier & Lounge Arch Icon Center -->
  <g transform="translate(400, 190)" filter="url(#shadow)">
    <!-- Chandelier Stem -->
    <line x1="0" y1="-65" x2="0" y2="-15" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="0" cy="-65" r="4" fill="url(#gold)"/>
    <!-- Chandelier Arms -->
    <path d="M -45,-15 C -45,15 0,15 0,-15 C 0,15 45,15 45,-15" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
    <path d="M -65,-5 C -65,30 0,30 0,-5 C 0,30 65,30 65,-5" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <!-- Candles / Crystals -->
    <circle cx="-45" cy="-22" r="3.5" fill="#FFF"/>
    <circle cx="45" cy="-22" r="3.5" fill="#FFF"/>
    <circle cx="-65" cy="-12" r="3.5" fill="#FFF"/>
    <circle cx="65" cy="-12" r="3.5" fill="#FFF"/>
    <circle cx="0" cy="-20" r="4" fill="#FFF"/>
    <!-- Hanging Crystals -->
    <polygon points="0,25 -3,35 0,42 3,35" fill="url(#gold)"/>
    <polygon points="-30,22 -32,30 -30,35 -28,30" fill="url(#gold)"/>
    <polygon points="30,22 28,30 30,35 32,30" fill="url(#gold)"/>
    <!-- Sparkles -->
    <path d="M -90,-20 Q -90,-10 -80,-10 Q -90,-10 -90,0 Q -90,-10 -100,-10 Q -90,-10 -90,-20 Z" fill="#FFE8B5"/>
    <path d="M 90,-20 Q 90,-10 100,-10 Q 90,-10 90,0 Q 90,-10 80,-10 Q 90,-10 90,-20 Z" fill="#FFE8B5"/>
  </g>

  <!-- Text & Typography -->
  <text x="400" y="320" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="2">
    DISEÑO &amp; MOBILIARIO
  </text>
  <text x="400" y="355" font-family="'Montserrat', sans-serif" font-size="14" font-weight="500" fill="#FFE8B5" text-anchor="middle" letter-spacing="4" opacity="0.85">
    SALAS LOUNGE • ARREGLOS FLORALES • PISTAS LED
  </text>
  <line x1="300" y1="380" x2="500" y2="380" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="400" y="415" font-family="'Montserrat', sans-serif" font-size="12.5" fill="#E2BA9B" text-anchor="middle" letter-spacing="1.5">
    INARA DECOR &amp; AMBIENTACIÓN ARQUITECTÓNICA
  </text>
</svg>