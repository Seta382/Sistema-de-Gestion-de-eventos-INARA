<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1628"/>
      <stop offset="50%" stop-color="#3A224E"/>
      <stop offset="100%" stop-color="#140D1D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F2D1F7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#C6A15B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E1628" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE8B5"/>
      <stop offset="50%" stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#9E7832"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="200" r="260" fill="url(#glow)"/>

  <!-- Decorative Border -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.5" rx="16"/>
  <rect x="35" y="35" width="730" height="430" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="6,4" stroke-opacity="0.3" rx="12"/>

  <!-- Tiara / Crown Icon Center -->
  <g transform="translate(400, 195)" filter="url(#shadow)">
    <!-- Crown Base -->
    <path d="M -60,25 Q 0,35 60,25 L 55,15 Q 0,25 -55,15 Z" fill="url(#gold)"/>
    <!-- Crown Spikes -->
    <path d="M -55,15 L -65,-20 L -30,5 L 0,-40 L 30,5 L 65,-20 L 55,15 Z" fill="url(#gold)" opacity="0.9"/>
    <!-- Jewels -->
    <circle cx="0" cy="-40" r="6" fill="#FFFFFF"/>
    <circle cx="-65" cy="-20" r="4.5" fill="#FFE8B5"/>
    <circle cx="65" cy="-20" r="4.5" fill="#FFE8B5"/>
    <circle cx="0" cy="5" r="5" fill="#E8B4F8"/>
    <!-- Sparkles -->
    <path d="M -110,-10 Q -110,5 -95,5 Q -110,5 -110,20 Q -110,5 -125,5 Q -110,5 -110,-10 Z" fill="url(#gold)"/>
    <path d="M 110,-20 Q 110,-5 125,-5 Q 110,-5 110,10 Q 110,-5 95,-5 Q 110,-5 110,-20 Z" fill="url(#gold)"/>
    <circle cx="-90" cy="-45" r="3" fill="#FFE8B5" opacity="0.8"/>
    <circle cx="90" cy="-55" r="2.5" fill="#FFE8B5" opacity="0.8"/>
    <circle cx="-40" cy="-60" r="2" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="50" cy="-55" r="2" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Text & Typography -->
  <text x="400" y="320" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="2">
    QUINCEAÑEROS &amp; PROMS
  </text>
  <text x="400" y="355" font-family="'Montserrat', sans-serif" font-size="14" font-weight="500" fill="#FFE8B5" text-anchor="middle" letter-spacing="4" opacity="0.85">
    FIESTAS TEMÁTICAS &amp; SHOWS EN VIVO
  </text>
  <line x1="300" y1="380" x2="500" y2="380" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="400" y="415" font-family="'Montserrat', sans-serif" font-size="12.5" fill="#D3A7DE" text-anchor="middle" letter-spacing="1.5">
    INARA TEEN LUXURY • EXPERIENCIAS VIBRANTES
  </text>
</svg>